llm:
  provider: "groq"
  model_id: "llama-3.3-70b-versatile"
  # Other high-performance models available on Groq:
  # - "llama-3.1-8b-instant"
  # - "mixtral-8x7b-32768"
  # - "gemma2-9b-it"
  local_model_id: "microsoft/Phi-3.5-mini-instruct"
  temperature: 0.1
  max_new_tokens: 4096

embedding:
  model_id: "BAAI/bge-small-en-v1.5"
  device: "auto"
  normalize_embeddings: true

reranker:
  enabled: true
  model_id: "BAAI/bge-reranker-base"
  device: "auto"
