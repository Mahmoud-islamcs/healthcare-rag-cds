llm:
  provider: "groq"
  model_id: "qwen/qwen3.6-27b"
  # Other high-performance models available on your Groq key:
  # - "openai/gpt-oss-120b"
  # - "openai/gpt-oss-20b"
  # - "allam-2-7b"
  local_model_id: "microsoft/Phi-3.5-mini-instruct"
  temperature: 0.1
  max_new_tokens: 4096

embedding:
  model_id: "BAAI/bge-small-en-v1.5"
  device: "auto"
  normalize_embeddings: true

reranker:
  enabled: true
  model_id: "BAAI/bge-reranker-base"
  device: "auto"
